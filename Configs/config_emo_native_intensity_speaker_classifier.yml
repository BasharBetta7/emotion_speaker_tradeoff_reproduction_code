log_dir: "Models/exp11_native_intensity_speaker_classifier"
save_freq: 5
device: "cuda"
epochs: 150
batch_size: 32
pretrained_model: ""
load_only_params: false
finetune: false
fp16_run: true

train_data: "./Data/train_list_emo_balanced.txt"
val_data: "./Data/val_list_emo_balanced.txt"

dataset_params:
  mean: -5.254061
  std: 4.575295

F0_path: "Utils/JDC/bst.t7"
ASR_config: "Utils/ASR/config.yml"
ASR_path: "Utils/ASR/epoch_00100.pth"

preprocess_params:
  sr: 24000
  spect_params:
    n_fft: 2048
    win_length: 1200
    hop_length: 300

model_params:
  dim_in: 64
  style_dim: 64
  latent_dim: 16
  num_domains: 5
  num_speakers: 10
  max_conv_dim: 512
  n_repeat: 4
  w_hpf: 0
  F0_channel: 256
  rank_enable: true
  rank_hidden_dim: 128

  spk_cls_enable: true
  spk_cls_hidden_dim: 256

loss_params:
  g_loss:
    lambda_sty: 1.
    lambda_cyc: 5.
    lambda_ds: 1.
    lambda_norm: 1.
    lambda_asr: 10.
    lambda_f0: 5.
    lambda_f0_sty: 0.1
    lambda_adv: 2.
    lambda_adv_cls: 0.5
    norm_bias: 0.5
    lambda_adv_spk_cls: 0.1
  d_loss:
    lambda_reg: 1.
    lambda_adv_cls: 0.1
    lambda_con_reg: 10.
    lambda_spk_cls: 0.1
  rank_loss:
    neutral_label: 2
    lambda_rank_margin: 0.2
    lambda_rank_interp: 0.2
    lambda_rank_mono: 0.1
    rank_margin: 0.2
    rank_margin_alpha: 0.05
    rank_eps: 0.000001
    intensity_alpha_min: 0.0
    intensity_alpha_max: 1.0
  speaker_loss:
    enabled: false
    lambda_spk_inv: 0.05
    temperature: 0.1

  adv_cls_epoch: 25
  con_reg_epoch: 30
  adv_spk_cls_epoch: 30 #added hyperparam

optimizer_params:
  lr: 0.0001
  rank_lr: 0.0001
