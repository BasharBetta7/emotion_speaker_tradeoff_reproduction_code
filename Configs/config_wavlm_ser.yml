model_name: "microsoft/wavlm-base"
train_metadata: "Data/esd_balanced_train.csv"
output_dir: "Models/wavlm_ser_esd/2"

seed: 42
val_ratio: 0.2
sample_rate: 16000
max_seconds: 6.0

train_batch_size: 8
eval_batch_size: 8
num_train_epochs: 6
learning_rate: 1.0e-5
warmup_ratio: 0.1
logging_steps: 50
save_total_limit: 3
num_workers: 2
metric_for_best_model: "macro_f1"
early_stopping_patience: 2
early_stopping_threshold: 0.0
freeze_feature_encoder: true
fp16: true
